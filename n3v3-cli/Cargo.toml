[package]
name = "n3v3"
description = "The n3v3 language CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "n3v3"
path = "src/main.rs"

[dependencies]
n3v3-common = { version = "5.0.3", path = "../crates/n3v3-common" }
n3v3-diagnostic = { version = "5.0.3", path = "../crates/n3v3-diagnostic" }
n3v3-syntax = { version = "5.0.3", path = "../crates/n3v3-syntax" }
n3v3-parser = { version = "5.0.3", path = "../crates/n3v3-parser" }
n3v3-hir = { version = "5.0.3", path = "../crates/n3v3-hir" }
n3v3-typeck = { version = "5.0.3", path = "../crates/n3v3-typeck" }
n3v3-eval = { version = "5.0.3", path = "../crates/n3v3-eval" }
n3v3-std = { version = "5.0.3", path = "../crates/n3v3-std" }
n3v3-fmt = { version = "5.0.3", path = "../crates/n3v3-fmt" }
n3v3-frontend = { version = "5.0.3", path = "../crates/n3v3-frontend" }
n3v3-lsp = { version = "5.0.3", path = "../crates/n3v3-lsp" }

clap.workspace = true
rustyline.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
termimad = "0.30"

[dev-dependencies]
tempfile.workspace = true

# Unix-only dependencies for package management features
[target.'cfg(unix)'.dependencies]
n3v3-config = { version = "5.0.3", path = "../crates/n3v3-config" }
n3v3-store = { version = "5.0.3", path = "../crates/n3v3-store" }
n3v3-derive = { version = "5.0.3", path = "../crates/n3v3-derive" }
n3v3-builder = { version = "5.0.3", path = "../crates/n3v3-builder" }
n3v3-fetch = { version = "5.0.3", path = "../crates/n3v3-fetch" }
reqwest = { workspace = true }
libc.workspace = true
