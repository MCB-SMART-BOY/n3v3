[package]
name = "n3v3-workspace"
version = "5.0.1"
edition = "2024"
license = "MPL-2.0"

[workspace]
resolver = "2"
members = [
    "crates/*",
    "n3v3-cli",
    "tree-sitter-n3v3/bindings/rust",
]

[workspace.package]
version = "5.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/MCB-SMART-BOY/n3v3"

# Optimized release profile for smaller, faster binaries
# 优化的 release profile，生成更小更快的二进制文件
[profile.release]
lto = true
strip = true
codegen-units = 1
# NOTE: The abort setting reduces binary size but prevents catch_unwind
# from working. Dependencies that use catch_unwind internally (e.g. tokio)
# will abort the process on panic instead of unwinding. This is acceptable
# for CLI tools but may need review for long-running server processes (LSP).
panic = "abort"
opt-level = 3

# Development profile with some optimizations for faster iteration
# 开发 profile，保持一些优化以加快迭代
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
# Internal crates
n3v3-common = { path = "crates/n3v3-common" }
n3v3-diagnostic = { path = "crates/n3v3-diagnostic" }
n3v3-lexer = { path = "crates/n3v3-lexer" }
n3v3-syntax = { path = "crates/n3v3-syntax" }
n3v3-parser = { path = "crates/n3v3-parser" }
n3v3-hir = { path = "crates/n3v3-hir" }
n3v3-typeck = { path = "crates/n3v3-typeck" }
n3v3-eval = { path = "crates/n3v3-eval" }
n3v3-std = { path = "crates/n3v3-std" }
n3v3-derive = { path = "crates/n3v3-derive" }
n3v3-frontend = { path = "crates/n3v3-frontend" }
n3v3-store = { path = "crates/n3v3-store" }
n3v3-fetch = { path = "crates/n3v3-fetch" }
n3v3-builder = { path = "crates/n3v3-builder" }
n3v3-config = { path = "crates/n3v3-config" }
n3v3-lsp = { path = "crates/n3v3-lsp" }
n3v3-fmt = { path = "crates/n3v3-fmt" }

# External dependencies
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
rustyline = "15"
logos = "0.15"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
lzma-rs = "0.3"
zstd = "0.13"
tempfile = "3"
# Platform-specific: nix crate only on Unix-like systems
nix = { version = "0.29", features = ["user", "fs", "process", "mount", "sched", "hostname", "resource"] }
tower-lsp = "0.20"
async-trait = "0.1"
dashmap = "6"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
libc = "0.2"

# Dependencies for integration tests
[dev-dependencies]
n3v3-common = { path = "crates/n3v3-common" }
n3v3-diagnostic = { path = "crates/n3v3-diagnostic" }
n3v3-lexer = { path = "crates/n3v3-lexer" }
n3v3-syntax = { path = "crates/n3v3-syntax" }
n3v3-parser = { path = "crates/n3v3-parser" }
n3v3-hir = { path = "crates/n3v3-hir" }
n3v3-typeck = { path = "crates/n3v3-typeck" }
n3v3-eval = { path = "crates/n3v3-eval" }
n3v3-std = { path = "crates/n3v3-std" }
n3v3-derive = { path = "crates/n3v3-derive" }
n3v3-frontend = { path = "crates/n3v3-frontend" }
n3v3-store = { path = "crates/n3v3-store" }
n3v3-fetch = { path = "crates/n3v3-fetch" }
n3v3-builder = { path = "crates/n3v3-builder" }
n3v3-config = { path = "crates/n3v3-config" }
n3v3-lsp = { path = "crates/n3v3-lsp" }
n3v3-fmt = { path = "crates/n3v3-fmt" }
tempfile = "3"
