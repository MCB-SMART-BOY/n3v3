[package]
name = "n3v3-builder"
description = "Sandbox build system for the n3v3 language"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
n3v3-derive = { version = "5.0.1", path = "../n3v3-derive" }
n3v3-store = { version = "5.0.1", path = "../n3v3-store" }
n3v3-fetch = { version = "5.0.1", path = "../n3v3-fetch" }
thiserror.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["sched", "hostname", "resource"] }
libc.workspace = true

